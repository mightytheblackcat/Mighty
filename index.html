<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mighty Black Cat ($MIGHTY)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #0f0518 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            width: 100%;
            padding: 40px 20px;
            text-align: center;
        }

        .logo {
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: #c77dff;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(2.8rem, 8vw, 4.5rem);
            font-weight: 900;
            background: linear-gradient(90deg, #e0aaff, #c77dff, #9b5de5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-shadow: 0 0 40px rgba(199, 125, 255, 0.4);
        }

        .ticker {
            font-size: 1.4rem;
            color: #c77dff;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .cat-img {
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(155, 93, 229, 0.45);
            border: 3px solid #9b5de5;
            margin: 20px auto 35px;
            transition: transform 0.3s ease;
        }

        .cat-img:hover {
            transform: scale(1.03);
        }

        .description {
            font-size: 1.25rem;
            line-height: 1.6;
            color: #e0d4ff;
            max-width: 600px;
            margin: 0 auto 40px;
        }

        .description strong {
            color: #c77dff;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            margin-bottom: 50px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.25s ease;
            border: 2px solid transparent;
        }

        .btn-pump {
            background: linear-gradient(90deg, #9b5de5, #c77dff);
            color: #1a0a2e;
        }

        .btn-pump:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(155, 93, 229, 0.5);
        }

        .btn-tg {
            background: transparent;
            color: #c77dff;
            border-color: #c77dff;
        }

        .btn-tg:hover {
            background: #c77dff;
            color: #1a0a2e;
            transform: translateY(-3px);
        }

        .btn-x {
            background: transparent;
            color: #e0aaff;
            border-color: #e0aaff;
        }

        .btn-x:hover {
            background: #e0aaff;
            color: #1a0a2e;
            transform: translateY(-3px);
        }

        footer {
            margin-top: auto;
            padding: 25px;
            font-size: 0.9rem;
            color: #9b7bb8;
        }

        @media (max-width: 600px) {
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
                max-width: 280px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">The strongest black cat in the game</div>
</body>
</html>
